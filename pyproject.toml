[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationdesignjm"
version = "0.2.0"
description = "Eurocode-based foundation design library (shallow, piles, walls, seismic)."
readme = "README.md"
authors = [{ name = "Jesus Murgas" }]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["foundation", "geotechnical", "eurocode", "EC7", "EC2", "structural"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.0", "jmstructural-common"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "plotly>=5.0"]
numeric = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
dev = ["pytest>=7.0", "pytest-cov"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "coverage>=7.0", "hypothesis>=6.0"]
desktop = ["matplotlib>=3.7", "numpy>=1.24"]
dashboard = ["streamlit>=1.30", "matplotlib>=3.7", "numpy>=1.24"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.25"]
examples = ["PyniteFEA>=0.0.90"]
memos = [
    "handcalcs>=1.6",
    "forallpeople>=2.6",
]

[project.scripts]
foundationdesignjm-desktop = "foundationdesignjm.desktop.app:main"
foundationdesignjm-dashboard = "foundationdesignjm.dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["foundationdesignjm*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: tests unitarios rapidos (<100ms)",
    "integration: requieren stack completo o multiples modulos",
    "slow: tests con duracion alta (>5s)",
    "fastsap: requieren puente FastSAP (omitir en CI sin SAP)",
    "safety_critical: validados contra valores publicados (tol <= 2%)",
    "examples: ejecutan examples/*.py como subprocess",
    "property: property-based con hypothesis",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["foundationdesignjm"]
omit = [
    "foundationdesignjm/_brand.py",
    "foundationdesignjm/desktop/*",
    "foundationdesignjm/dashboard/*",
    "foundationdesignjm/reports/pdf_report.py",
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 70
show_missing = true

[tool.uv.sources]
jmstructural-common = { workspace = true }
