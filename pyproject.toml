[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationcalc"
version = "1.1.0"
description = "Foundation design in Python to EN 1997-1, EN 1992-1-1, EN 1998-5 and ACI 318: EN 1997-1 Annex D bearing capacity with partial factors, contact pressures, settlement and consolidation, CPT and SPT correlations, punching of column bases with control perimeters within 2d, footing flexure, combined and strap footings, pile caps, mats on Winkler springs, pile axial and lateral (p-y) capacity, pile groups, cantilever, basement, gravity, MSE, anchored and diaphragm walls, Mononobe-Okabe, Gazetas springs and an ETABS-to-SAFE foundation chain with a calculation report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["foundation-design", "geotechnical-engineering", "eurocode-7", "en-1997-1", "eurocode-2", "aci-318", "punching-shear", "bearing-capacity", "footings", "pile-foundations", "p-y-curves", "retaining-walls", "mat-foundation", "winkler", "soil-structure-interaction", "structural-engineering", "loadpath"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.0", "reportlab>=4.0"]

[project.optional-dependencies]
numeric = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
plot = ["matplotlib>=3.7", "plotly>=5.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "coverage>=7.0", "hypothesis>=6.0", "pytest-timeout>=2.1"]
desktop = ["matplotlib>=3.7", "numpy>=1.24"]
dashboard = ["streamlit>=1.30", "matplotlib>=3.7", "numpy>=1.24"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.25"]
examples = ["PyniteFEA>=0.0.90"]
memos = ["handcalcs>=1.6", "forallpeople>=2.6"]

[project.scripts]
foundationcalc-desktop = "foundationcalc.desktop.app:main"
foundationcalc-dashboard = "foundationcalc.dashboard.__main__:main"

[project.urls]
Homepage = "https://github.com/jmurgass99/foundationcalc"
Repository = "https://github.com/jmurgass99/foundationcalc"
Issues = "https://github.com/jmurgass99/foundationcalc/issues"

[tool.setuptools.packages.find]
include = ["foundationcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "property: property-based con hypothesis",
    "safety_critical: validados contra valores publicados",
]
