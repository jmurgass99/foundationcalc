[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationcalc"
version = "1.0.0"
description = "Foundation design to EN 1997-1, EN 1998-5, ACI 318 and NSR-10: bearing capacity and settlement, isolated, combined and strap footings, mat foundations (Winkler), pile capacity and pile groups, pile caps, retaining, basement, counterfort, MSE and diaphragm walls, punching shear, reinforcement and PDF reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["foundation-design", "eurocode-7", "aci-318", "footings", "piles", "retaining-walls", "punching-shear", "geotechnical", "structural-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.0", "reportlab>=4.0"]

[project.optional-dependencies]
numeric = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
plot = ["matplotlib>=3.7", "plotly>=5.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "coverage>=7.0", "hypothesis>=6.0", "pytest-timeout>=2.1"]
desktop = ["matplotlib>=3.7", "numpy>=1.24"]
dashboard = ["streamlit>=1.30", "matplotlib>=3.7", "numpy>=1.24"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.25"]
examples = ["PyniteFEA>=0.0.90"]
memos = ["handcalcs>=1.6", "forallpeople>=2.6"]

[project.scripts]
foundationcalc-desktop = "foundationcalc.desktop.app:main"
foundationcalc-dashboard = "foundationcalc.dashboard.__main__:main"

[project.urls]
Homepage = "https://github.com/jmurgass99/foundationcalc"
Repository = "https://github.com/jmurgass99/foundationcalc"
Issues = "https://github.com/jmurgass99/foundationcalc/issues"

[tool.setuptools.packages.find]
include = ["foundationcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "property: property-based con hypothesis",
    "safety_critical: validados contra valores publicados",
]
